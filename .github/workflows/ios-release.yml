# Uploads a build of the iOS app to TestFlight. Started by hand from the
# Actions tab; never runs on its own.
#
# NOT YET PROVEN: this has never run, because it needs an Apple Developer
# account that did not exist when it was written. Expect to adjust it on the
# first real run. Setup steps are in ios/README.md.
#
# Repository secrets it needs:
#   APPLE_TEAM_ID   - the 10-character team ID from developer.apple.com
#   ASC_KEY_ID      - App Store Connect API key ID
#   ASC_ISSUER_ID   - App Store Connect API issuer ID
#   ASC_KEY_P8      - the contents of the downloaded AuthKey_XXXX.p8 file
name: iOS release (TestFlight)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the App Store, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - name: Check the Apple credentials are configured
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See ios/README.md."
            exit 1
          fi
          if ! printf '%s' "$APP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Version must look like 1.0.0"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Logic tests (MiamiElioKit)
        working-directory: ios/MiamiElioKit
        run: swift test

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Store the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project MiamiElio.xcodeproj \
            -scheme MiamiElio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MiamiElio.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet

      - name: Upload to TestFlight
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/MiamiElio.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
