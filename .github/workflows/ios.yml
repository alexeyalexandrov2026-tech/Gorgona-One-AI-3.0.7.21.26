# Builds and tests the iOS app (ios/) on a Mac whenever it changes. The app
# cannot be compiled anywhere else, so this run is the proof that it builds.
name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The translated strings are generated from the website's translations;
      # fail if someone changed one side without regenerating.
      - name: Strings match the website
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON ios/scripts/build-strings.mjs --check

      # Miami's season (the weeks on the concierge screen and its reminders)
      # is copied from the home page's list; fail if the two have drifted.
      - name: Season matches the website
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON ios/scripts/build-season.mjs --check

      - name: Logic tests (MiamiElioKit)
        working-directory: ios/MiamiElioKit
        run: swift test

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Choose a simulator
        id: simulator
        run: echo "udid=$(ios/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      # Start it now, so that it boots while the app compiles. UI tests sent
      # to a simulator that is still starting up have failed before they began
      # ("Timed out waiting for AX loaded notification") and have missed taps.
      - name: Start the simulator
        run: xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true

      - name: Build
        working-directory: ios
        run: |
          xcodebuild build-for-testing \
            -project MiamiElio.xcodeproj \
            -scheme MiamiElio \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -quiet

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: UI tests
        working-directory: ios
        run: |
          xcodebuild test-without-building \
            -project MiamiElio.xcodeproj \
            -scheme MiamiElio \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/UITests.xcresult

      # Keep just the named screenshots the tests took; the result bundle
      # also holds screen recordings and diagnostics that run to tens of MB.
      - name: Collect screenshots
        if: always()
        working-directory: ios
        run: |
          [ -d build/UITests.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/attachments || exit 0
          python3 scripts/collect-screenshots.py build/attachments build/screenshots

      # Step logs open only to someone signed in to GitHub; annotations show to
      # anyone. So they say which test failed, in which file and on which
      # line, and the assertion's wording cleaned of anything taken from the
      # screen or from a person - nothing more (scripts/report-test-failures.mjs,
      # checked by tests/content/ios-failure-report.test.mjs).
      - name: Report failed tests
        if: failure()
        working-directory: ios
        run: |
          [ -d build/UITests.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path build/UITests.xcresult > build/tests.json || true
          xcrun xcresulttool get test-results summary --path build/UITests.xcresult > build/summary.json || true
          node scripts/report-test-failures.mjs build/tests.json build/summary.json

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore

  # TestFlight (ios-release.yml) needs an Apple Developer account to sign and
  # upload. Until then, archive the Release build the same way, unsigned, and
  # check what App Store Connect reads, so the first real upload does not fail
  # on something a build could have caught. Runs beside the UI tests.
  release-archive:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Archive (Release, unsigned)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project MiamiElio.xcodeproj \
            -scheme MiamiElio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MiamiElio.xcarchive \
            MARKETING_VERSION=9.9.9 \
            CURRENT_PROJECT_VERSION=999.1 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # The version and build number given above must reach the app, as the
      # ones the TestFlight workflow gives will.
      - name: Check the archive
        working-directory: ios
        run: bash scripts/check-release-archive.sh build/MiamiElio.xcarchive 9.9.9 999.1
