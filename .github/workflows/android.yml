name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/languages.js'
      - 'lib/seasonData.js'
      - '.github/workflows/android.yml'
  push:
    branches: [main, 'claude/android-app-agent-rr0ij5', 'feat/android-release']
    paths:
      - 'android/**'
      - 'lib/languages.js'
      - 'lib/seasonData.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Check Android assets
        run: |
          node android/scripts/build-strings.mjs --check
          node android/scripts/build-season.mjs --check
      - name: Build and test
        working-directory: android
        run: bash ./gradlew --max-workers=2 testDebugUnitTest lintDebug assembleDebug bundleRelease
      - name: Verify the web bridge
        run: node android/scripts/verify-web-bridge.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-reports
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/outputs/snapshots/
