# Runs the content tests and a Next.js production build on every pull request
# and on main, so a broken change shows up red before it reaches production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run i18n:check
      # PGlite fixtures own separate database heaps. Bound process concurrency
      # so CPU-rich runners cannot exhaust memory before reporting assertions.
      - run: node --test --test-concurrency=2 tests/content/*.test.mjs tests/i18n/*.test.mjs tests/dashboard/*.test.mjs tests/concierge/*.test.mjs
      - name: Install the supported test browser
        run: npx playwright install --with-deps chromium
      - name: Concierge browser regressions without external services
        run: |
          node tests/concierge/locale-browser.mjs
          node tests/concierge/locale-restoration-browser.mjs
          node tests/concierge/deferred-hydration-browser.mjs
          node tests/concierge/focus-browser.mjs
          node tests/concierge/voice-lifecycle-browser.mjs
      # Only the Next.js build: the full `npm run build` also packages the
      # Cloudflare worker and the ai-router, which Workers Builds does on deploy.
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
