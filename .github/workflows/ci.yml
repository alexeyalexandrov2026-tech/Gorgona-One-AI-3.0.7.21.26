name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The vendored new ia/ and ai-router/ folders are not part of the site
      # build; skipping them saves most of the checkout.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
            lib
            public
            database
            scripts
            tests
            e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Database policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            database
            scripts
      - name: Ensure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: bash scripts/test-db.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
