# Runs the content tests and a Next.js production build on every pull request
# and on main, so a broken change shows up red before it reaches production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: node --test tests/content/*.test.mjs tests/i18n/*.test.mjs tests/dashboard/*.test.mjs
      # Only the Next.js build: the full `npm run build` also packages the
      # Cloudflare worker and the ai-router, which Workers Builds does on deploy.
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
