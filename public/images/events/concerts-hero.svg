<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1250" width="2000" height="1250">
  <title>Concerts and live shows</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d0f33"/>
      <stop offset="42%" stop-color="#120a22"/>
      <stop offset="100%" stop-color="#070410"/>
    </linearGradient>
    <linearGradient id="beam-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd275" stop-opacity="0.62"/>
      <stop offset="58%" stop-color="#ffc860" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffc860" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c48bff" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#a86dff" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#a86dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7fc4" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#ff5fae" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff5fae" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="footlight" cx="0.5" cy="1" r="0.72">
      <stop offset="0%" stop-color="#ffcb6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffcb6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="34%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="1250" fill="url(#sky)"/>

