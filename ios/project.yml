# The Xcode project is generated from this file - it is not stored in git.
#   brew install xcodegen && cd ios && xcodegen generate && open MiamiElio.xcodeproj
name: MiamiElio

options:
  bundleIdPrefix: com.miamielio
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only. iPad runs the app in iPhone compatibility mode.
    TARGETED_DEVICE_FAMILY: "1"
    # Set to the Apple Developer team ID to run on a device or archive.
    DEVELOPMENT_TEAM: ""

packages:
  MiamiElioKit:
    path: MiamiElioKit

targets:
  MiamiElio:
    type: application
    platform: iOS
    sources:
      - path: MiamiElio
    dependencies:
      - package: MiamiElioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miamielio.app
        PRODUCT_NAME: MiamiElio
        INFOPLIST_FILE: MiamiElio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  MiamiElioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiamiElioUITests
    dependencies:
      - target: MiamiElio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miamielio.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MiamiElio
        CODE_SIGN_STYLE: Automatic

schemes:
  MiamiElio:
    build:
      targets:
        MiamiElio: all
        MiamiElioUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MiamiElioUITests
    archive:
      config: Release
